<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DUSK — Intro 9:16</title>
<style>
@font-face{font-family:'Manrope';font-weight:300;src:url(fonts/manrope-latin-300-normal.woff2)}
@font-face{font-family:'Manrope';font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:'Manrope';font-weight:700;src:url(fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:'Manrope';font-weight:800;src:url(fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:'Instrument Serif';font-style:normal;src:url(fonts/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:'Instrument Serif';font-style:italic;src:url(fonts/instrument-serif-latin-400-italic.woff2)}

:root{
  --bg:#030912; --blue:#2451B5; --ice:#93C5FD; --glow:#BFDBFE; --frost:#EFF6FF; --muted:#7C8DA8; --ink:#06142B;
  --sans:'Manrope','Inter',sans-serif; --serif:'Instrument Serif',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;perspective:1800px;color:#fff;font-family:var(--sans)}
canvas#bg{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}

/* glass */
.glass{
  background:linear-gradient(140deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 45%,rgba(147,197,253,.08) 100%);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(147,197,253,.15),0 50px 140px rgba(0,8,32,.65),0 0 80px rgba(36,81,181,.18);
  overflow:hidden;
}
.glass .spec{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen}

/* type */
.gr{background:linear-gradient(100deg,#7DB3F7 0%,#EFF6FF 40%,#93C5FD 60%,#5B8DEF 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;font-size:122px;letter-spacing:-.01em;line-height:1;
  background:linear-gradient(100deg,#7DB3F7 0%,#EFF6FF 40%,#93C5FD 60%,#5B8DEF 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:var(--sans);font-weight:500;font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--ice);white-space:nowrap}
/* máscara de revelação tipográfica */
.mk{display:inline-block;overflow:clip;padding:.1em .14em .22em;margin:-.1em -.14em -.22em;vertical-align:baseline}
.mk>span{display:inline-block;will-change:transform}
.n7{font-family:var(--sans);font-style:normal;font-weight:700;font-size:.92em;letter-spacing:-.04em;color:#fff;-webkit-text-fill-color:#fff;margin-right:.08em}

/* S1 — digitação */
#typed{left:96px;top:910px;width:888px;text-align:center}
.tyl{position:relative;white-space:nowrap;overflow:clip;padding:.1em .16em .24em 0;margin:-.1em -.16em -.24em 0}
#ty1{font:500 84px/100px var(--sans);color:#fff}
#ty2{font:italic 400 300px/280px var(--serif)}
.ch{display:inline-block;will-change:transform,opacity,filter}
#caret{position:absolute;left:0;top:0;width:3px;height:70px;background:var(--ice);box-shadow:0 0 14px rgba(147,197,253,.55);opacity:0}

/* moldura de precisão (motivo recorrente) */
#frame i{position:absolute;width:46px;height:46px;border:0 solid var(--fc,rgba(147,197,253,.55));opacity:0}
#frame i.tl{border-top-width:1.5px;border-left-width:1.5px}
#frame i.tr{border-top-width:1.5px;border-right-width:1.5px}
#frame i.bl{border-bottom-width:1.5px;border-left-width:1.5px}
#frame i.br{border-bottom-width:1.5px;border-right-width:1.5px}

/* S2 — cena clara */
#light{position:absolute;inset:0;background:#F7FAFF;visibility:hidden;overflow:hidden}
#light::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(6,20,43,.07) 0 1px,transparent 1px 148px);background-position:96px 0}
#head{position:absolute;left:0;top:560px;width:1080px;padding:0 96px;display:flex;flex-direction:column}
.hl{position:relative;display:flex;align-items:baseline;gap:30px;white-space:nowrap}
.hl.end{justify-content:flex-end}
.lsans{font-family:var(--sans);font-weight:500;color:var(--ink);line-height:1}
.lserif{font-family:var(--serif);font-style:italic;font-weight:400;line-height:1;letter-spacing:-.01em;
  background:linear-gradient(100deg,#1B3A82 0%,#2F68E0 40%,#1B3A82 62%,#6AA0F8 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ul{position:absolute;left:0;bottom:2px;height:16px;pointer-events:none}
.ul svg{overflow:visible;display:block}
.ul path{fill:none;stroke:#2F68E0;stroke-width:4;stroke-linecap:round}
.hl .rl{flex:1;height:1.5px;background:rgba(6,20,43,.45);transform-origin:0 50%;align-self:center;margin-top:60px}
#edge2{position:absolute;top:0;bottom:0;width:1px;background:rgba(147,197,253,.9);visibility:hidden}
#edge2::before{content:"";position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(to left,rgba(3,9,18,.22),transparent)}

/* S3 — cards */
.card{border-radius:36px;padding:36px}
.card .n{font-weight:500;font-size:20px;letter-spacing:.3em;color:var(--ice)}
.card .cr{position:absolute;left:36px;right:36px;top:88px;height:1px;background:rgba(191,219,254,.28);transform-origin:0 50%}
.card h3{position:absolute;left:36px;bottom:104px;font-weight:600;font-size:38px;letter-spacing:-.03em;color:#fff;line-height:1.1}
.card p{position:absolute;left:36px;bottom:36px;width:370px;line-height:1.35;font-weight:300;font-size:22px;color:#A9B8D0;
  display:flex;flex-wrap:wrap;column-gap:.28em;align-items:baseline}
.card p em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--glow);font-size:1.22em;letter-spacing:0}
.card svg{position:absolute;left:50%;top:36%;width:150px;height:150px;margin:-100px 0 0 -75px;overflow:visible}
.card.big h3{font-size:68px;bottom:96px;letter-spacing:-.035em}
.card.big p{font-size:28px;width:640px}
.card.big svg{left:auto;right:90px;top:50%;width:330px;height:330px;margin:-190px 0 0 0}
.card.big .n,.card.big h3,.card.big p{left:48px}
.card.big .cr{left:48px;right:48px}
.card svg *{fill:none;stroke:url(#sg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.card .arr{position:absolute;right:36px;top:30px;font-size:30px;color:var(--ice);font-weight:300}

/* S4 — galeria em vidro */
#gallery{position:absolute;inset:0;visibility:hidden}
#gtilt{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
.grow{position:absolute;left:0;width:1px;height:315px;display:flex;gap:34px;will-change:transform;filter:url(#hb)}
.gfr{position:relative;flex:none;width:560px;height:315px;border-radius:26px;padding:10px;
  background:linear-gradient(140deg,rgba(255,255,255,.30),rgba(255,255,255,.07) 50%,rgba(147,197,253,.2));
  border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 40px 100px rgba(0,8,32,.6),0 0 60px rgba(36,81,181,.2)}
.gfr img{width:100%;height:100%;object-fit:cover;border-radius:17px;display:block}
.gfr::after{content:"";position:absolute;inset:10px;border-radius:17px;background:linear-gradient(120deg,rgba(255,255,255,.26) 0%,transparent 38%);mix-blend-mode:screen;pointer-events:none}

/* S5 */
.wl{height:170px;text-align:center;white-space:nowrap}
.wl .serif{font-size:170px}

#grain{position:absolute;inset:-100px;mix-blend-mode:overlay;opacity:.12;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,transparent 40%,rgba(1,4,10,.75) 100%);pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="vig"></div>

  <!-- S1 — "Nós somos Dusk" (digitação) -->
  <div class="abs" id="typed"><div class="tyl" id="ty1"></div><div class="tyl" id="ty2"></div><i id="caret"></i></div>

  <!-- S2 — manifesto, fundo claro -->
  <div id="light">
    <div id="head"></div>
    <div id="edge2"></div>
  </div>

  <!-- S3 — frentes -->
  <div class="abs" id="tit3" style="left:96px;top:420px"><span class="mk"><span class="serif" style="font-size:96px"><b class="n7">+7</b> anos construindo:</span></span></div>
  <div id="cards"></div>

  <!-- S4 — galeria -->
  <div id="gallery"><div id="gtilt"></div></div>

  <!-- S5 — encerramento -->
  <div class="abs" id="welcome" style="left:0;top:480px;width:1080px"></div>
  <div class="abs" id="aoWrap" style="left:0;top:880px;width:1080px;text-align:center"><span class="mk"><span class="tag" style="padding-left:.42em">ao</span></span></div>
  <svg class="abs" id="logo" viewBox="0 0 7655 1158" style="left:130px;top:1060px;width:820px;height:124px" fill="#fff">
    <g id="gD"><path d="M1572.14 1.78516H0L173.129 307.908H1433.96C1526.48 307.908 1563.96 350.301 1547.45 442.822L1497.92 728.566C1483.05 819.451 1440.06 855.745 1349.33 855.745H543.035L774.023 454.275H402.182L0 1158H1413.59C1682.8 1158 1824.84 1039 1872.74 768.133L1932.23 437.764C1957.07 304.04 1935.5 198.281 1869.46 118.998C1803.43 41.352 1704.22 1.78516 1572.14 1.78516Z"/></g>
    <g id="gU"><path d="M3376.16 739.127C3362.92 818.558 3334.81 843.25 3255.39 843.25H2555.88C2476.46 843.25 2451.77 811.864 2465 732.433L2594.11 0H2210.52L2068.32 806.956C2026.98 1036.77 2129.45 1157.55 2355.98 1157.55H3367.98C3594.51 1157.55 3700.41 1069.94 3741.61 840.126L3890.49 0H3506.9L3376.31 739.127H3376.16Z"/></g>
    <g id="gS"><path d="M5475.12 0.446111H4340.86C4160.59 0.446111 4079.53 68.275 4048.15 248.557L4020.04 402.362C3990.29 575.951 4066.3 668.62 4246.56 676.801L5194.01 716.517C5245.33 718.153 5256.78 736.3 5248.6 790.891L5242.05 833.879C5230.45 888.469 5213.94 906.616 5159.36 906.616H4362.43C4307.84 906.616 4291.33 886.833 4299.66 833.879L4307.99 785.982H3937.64L3921.13 883.561C3889.75 1063.84 3967.39 1158 4146.02 1158H5319.99C5498.62 1158 5579.54 1090.17 5611.07 909.889L5642.45 732.879C5673.84 555.87 5597.83 464.985 5415.93 458.44L4468.48 417.088C4417.16 415.452 4407.35 398.941 4415.53 344.351L4418.8 322.782C4427.13 268.192 4446.91 250.045 4499.86 250.045H5257.23C5311.81 250.045 5328.32 268.192 5321.78 322.782L5316.87 355.804H5687.22L5698.82 274.737C5726.93 91.1821 5652.57 0.297363 5475.57 0.297363L5475.12 0.446111Z"/></g>
    <g id="gK"><path d="M6337.2 0H5953.61L5861.54 509.014H6244.54L6337.2 0Z"/><path d="M7041.61 0L6244.68 519.278C6186.83 532.665 6065.01 567.621 5953.31 658.059C5952.57 658.654 5951.67 659.398 5950.93 659.993C5864.22 730.946 5806.51 831.053 5786.88 941.424L5748.65 1157.41H6132.24L6229.81 605.254L6879.34 1157.41H7456.44L6715.88 568.96L7655 0H7041.61Z"/></g>
  </svg>
  <div class="abs glass" id="pill" style="left:150px;top:1330px;width:780px;height:92px;border-radius:46px;display:flex;align-items:center;justify-content:center">
    <span class="tag" style="font-size:19px;letter-spacing:.34em;color:#DCEBFF">Branding · Design · Estratégia</span>
  </div>

  <div id="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
  <div id="grain"></div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="hb" x="-2%" y="0" width="104%" height="100%"><feGaussianBlur stdDeviation="2.6 0"/></filter>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#4F86F0"/></linearGradient>
  </defs></svg>
</div>

<script>
const W=1080,H=1920;
/* ---------- linha do tempo (fonte única: o áudio lê estes mesmos tempos via timeline.json) ---------- */
const TL={
  bpm:120,
  // "Olá, nós somos o Dusk." — 18 teclas (sem espaços), todas na mesma linha
  keys:[.30,.37,.44,.52, .78,.85,.92, 1.10,1.17,1.24,1.31,1.38, 1.58, 1.90,1.98,2.06,2.14,2.24],
  sp:[.64,1.01,1.48,1.76],
  caretOut:[2.45,2.7], rule1:[2.55,3.0], t1:[3.0,3.8],                  // T1: linha vira máscara branca (drop)
  lines:[4.0,4.5,5.0,5.5,6.0,6.5], under:[5.1,5.95], t2:[8.5,9.2],      // T2: empurrão horizontal
  title:9.0, cards:[9.0,10.0,11.0], t3:[14.0,14.7],                     // T3: câmera avança
  rows:[14.0,14.1,14.2,14.3,14.4], t4:[20.0,20.7],                      // T4: fileiras colapsam na linha
  sj:[21.2,21.6], ao:22.0, ruleIn:[20.3,20.8], line:[22.4,23.0], settle:[23.4,23.9],
  glyph:23.0, lock:[23.7,24.3], pill:24.5, end:26.0
};
const T=TL.end;
const APPS=Array.from({length:22},(_,i)=>'app-'+(i+1));   // acrescente aqui novas imagens (assets/apps/app-N.jpg)

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const oQ=x=>1-Math.pow(1-x,4), oC=x=>1-Math.pow(1-x,3), oE=x=>x>=1?1:1-Math.pow(2,-9*x);
const ioC=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oB=x=>{const c1=1.05,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};   // overshoot discreto
const lerp=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);

function tf(el,{x=0,y=0,s=1,r=0,rx=0,ry=0,o=1,b=0}={}){
  el.style.transform=`translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${s})`;
  el.style.opacity=o;
  el.style.filter=b>.05?`blur(${b}px)`:'none';
  el.style.visibility=o<=.003?'hidden':'visible';
}
// revelação por máscara: kin 0..1 sobe de baixo; kout 0..1 sai por cima
const rise=(el,kin,kout=0,blur=0)=>{
  el.style.transform=`translate3d(0,${(1-kin)*110-kout*115}%,0)`;
  el.style.filter=blur>.05?`blur(${blur}px)`:'none';
};

/* ---------- DOM ---------- */
// S1 digitação
const keyQ=TL.keys.slice();
function typeLine(host,str,cls){
  return [...str].map(c=>{
    const s=document.createElement('span');s.className='ch '+cls;s.textContent=c===' '?' ':c;host.appendChild(s);
    if(c!==' ')s.dataset.kt=keyQ.shift();
    return s;
  });
}
const ch1=typeLine($('ty1'),'Olá, nós somos o Dusk.','');
const ch2=[];
const allCh=[...ch1,...ch2];

// S2 manifesto — escalas e alinhamentos variados
const HL=[
  {w:[['Um estúdio','s',80],['criativo','x',104]],lh:108},
  {w:[['que tem como missão','s',80]],lh:108},
  {w:[['construir','s',80],['marcas','x',104],['que','s',80]],lh:108},
  {w:[['conquistam','s',80],['o mercado','x',104]],lh:108},
  {w:[['e o coração','s',80]],lh:108},
  {w:[['das pessoas.','x',104]],lh:108},
];
const headLines=HL.map((l,li)=>{
  const d=document.createElement('div');d.className='hl'+(l.end?' end':'');d.style.height=l.lh+'px';
  const words=l.w.map(([txt,k,sz])=>{
    const m=document.createElement('span');m.className='mk';
    const sp=document.createElement('span');sp.className=k==='s'?'lsans':'lserif';sp.style.fontSize=sz+'px';sp.textContent=txt;
    m.appendChild(sp);d.appendChild(m);return sp;
  });
  let rl=null;
  if(li===2){rl=document.createElement('div');rl.className='ul';d.appendChild(rl)}
  $('head').appendChild(d);
  return {words,rl,sans:l.w.map(x=>x[1]==='s')};
});

// S3 cards
const cardsData=[
  {n:'01',t:'Criação de Marca',p:'Estratégia e <em>identidade visual</em>',x:80,y:580,w:920,h:500,big:1,
   svg:'<circle cx="60" cy="100" r="62" pathLength="1"/><circle cx="110" cy="100" r="62" pathLength="1"/><circle cx="160" cy="100" r="62" pathLength="1"/><circle cx="110" cy="100" r="22" pathLength="1"/>'},
  {n:'02',t:'Núcleo de Conteúdo',p:'Artes e vídeos para <em>redes sociais</em>',x:80,y:1120,w:440,h:440,
   svg:'<rect x="40" y="10" width="120" height="170" rx="18" pathLength="1"/><rect x="26" y="26" width="120" height="170" rx="18" pathLength="1"/><rect x="12" y="42" width="120" height="170" rx="18" pathLength="1"/>'},
  {n:'03',t:'Cobertura de Eventos',p:'After movie, stories e fotos em <em>tempo real</em>',x:560,y:1120,w:440,h:440,
   svg:'<circle cx="100" cy="100" r="86" pathLength="1"/><path d="M82 66L140 100L82 134Z" pathLength="1"/><path d="M-20 100H0M200 100H220" pathLength="1"/>'},
];
const cardEls=cardsData.map(c=>{
  const d=document.createElement('div');d.className='abs glass card';d.style.cssText+=`left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px`;if(c.big)d.classList.add('big');
  d.innerHTML=`<div class="spec"></div><div class="n">${c.n}</div><div class="arr">↗</div><div class="cr"></div>
    <svg viewBox="0 0 200 200">${c.svg}</svg><h3><span class="mk"><span>${c.t}</span></span></h3><p></p>`;
  const p=d.querySelector('p');
  // palavras com máscara (mantém <em> nas palavras-chave)
  const tmp=document.createElement('div');tmp.innerHTML=c.p;
  const words=[];
  tmp.childNodes.forEach(n=>{
    const em=n.nodeType===1;
    (n.textContent.trim().split(/\s+/)).filter(Boolean).forEach(wd=>{
      const m=document.createElement('span');m.className='mk';
      const s=document.createElement(em?'em':'span');s.textContent=wd;m.appendChild(s);p.appendChild(m);words.push(s);
    });
  });
  $('cards').appendChild(d);
  return {el:d,cx:c.x+c.w/2,cy:c.y+c.h/2,paths:[...d.querySelectorAll('svg *')],spec:d.querySelector('.spec'),
    cr:d.querySelector('.cr'),h3:d.querySelector('h3 .mk>span'),words,n:d.querySelector('.n'),arr:d.querySelector('.arr')};
});

// S4 galeria: 3 fileiras inclinadas
const ROWCFG=[1,-1,1,-1,1].map((dir,j)=>({y:803+(j-2)*345,dir,sp:[380,470,420,520,360][j],base:dir>0?-4100:-800,off:j*3}));
const rowEls=ROWCFG.map(cfg=>{
  const row=document.createElement('div');row.className='grow';row.style.top=cfg.y+'px';
  for(let i=0;i<10;i++){
    const f=document.createElement('div');f.className='gfr';
    const im=document.createElement('img');im.src=`assets/apps/${APPS[(i*5+cfg.off)%APPS.length]}.jpg`;f.appendChild(im);row.appendChild(f);
  }
  $('gtilt').appendChild(row);return row;
});

// S5
const sjSpans=['Seja','bem-vindo'].map(w=>{
  const d=document.createElement('div');d.className='wl';
  d.innerHTML=`<span class="mk"><span class="serif">${w}</span></span>`;$('welcome').appendChild(d);return d.querySelector('.serif');
});
const aoSpan=$('aoWrap').querySelector('.tag');
const glyphs=['gD','gU','gS','gK'].map($);

// grain
(function(){
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const id=x.createImageData(256,256);
  let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
  for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  x.putImageData(id,0,0);$('grain').style.backgroundImage=`url(${c.toDataURL()})`;
})();

/* ---------- canvas de fundo ---------- */
const cv=$('bg'),cx=cv.getContext('2d');
let sd=11;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const dust=Array.from({length:70},()=>({x:rnd()*W,y:rnd()*H,z:.3+rnd()*.9,p:rnd()*6.28,sp:.2+rnd()*.6}));

// âncoras dos orbes: [tempo, x, y, raio, alfa]
const A=[0,TL.t1[1],TL.t2[1],TL.t3[1],TL.t4[1],T];
const orbs=[
  {c:[36,81,181],k:[[A[0],540,1000,640,.5],[A[1],820,1500,720,.5],[A[2],260,520,700,.5],[A[3],700,1100,780,.5],[A[4],540,860,820,.56],[A[5],540,900,860,.62]]},
  {c:[147,197,253],k:[[A[0],420,1000,300,.2],[A[1],300,700,380,.16],[A[2],860,1300,420,.16],[A[3],300,900,420,.14],[A[4],540,780,420,.2],[A[5],540,820,440,.24]]},
  {c:[27,58,130],k:[[A[0],200,300,700,.5],[A[1],900,300,760,.45],[A[2],900,1500,760,.45],[A[3],200,1400,760,.45],[A[4],200,1500,760,.5],[A[5],200,1480,760,.5]]},
];
function orbAt(o,t){
  const k=o.k;let i=0;while(i<k.length-2&&t>k[i+1][0])i++;
  const a=k[i],b=k[i+1],e=ioC(seg(t,a[0],b[0]));
  return [1,2,3,4].map(j=>lerp(a[j],b[j],e));
}
// linha de precisão + marcas "+" nas interseções do grid (assinatura recorrente)
function pline(y,x0,x1,a,grow=1,marks=0){
  if(a<=.003||grow<=0)return;
  const xm=(x0+x1)/2,hw=(x1-x0)/2*grow;
  const g=cx.createLinearGradient(xm-hw,0,xm+hw,0);
  g.addColorStop(0,'rgba(191,219,254,0)');g.addColorStop(.12,`rgba(214,232,255,${.85*a})`);g.addColorStop(.88,`rgba(214,232,255,${.85*a})`);g.addColorStop(1,'rgba(191,219,254,0)');
  cx.fillStyle=g;cx.fillRect(xm-hw,y-.75,hw*2,1.5);
  if(marks>0){
    cx.strokeStyle=`rgba(191,219,254,${.55*a*marks})`;cx.lineWidth=1.2;
    for(let i=0;i<=6;i++){const x=96+i*148;if(x<xm-hw||x>xm+hw)continue;
      cx.beginPath();cx.moveTo(x-9,y);cx.lineTo(x+9,y);cx.moveTo(x,y-9);cx.lineTo(x,y+9);cx.stroke()}
  }
}
function lineState(t){   // linha da finalização: y/x/alfa/crescimento
  const gIn=oQ(seg(t,TL.ruleIn[0],TL.ruleIn[1]));
  const m=ioC(seg(t,TL.line[0],TL.line[1])),s2=ioC(seg(t,TL.settle[0],TL.settle[1]));
  const y=t<TL.line[0]?960:lerp(lerp(960,1184,m),1220,s2);
  const x0=lerp(96,130,m),x1=lerp(984,950,m);
  return {y,x0,x1,grow:gIn,a:1};
}
function drawBg(t){
  cx.globalCompositeOperation='source-over';cx.fillStyle='#030912';cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  orbs.forEach((o,i)=>{
    let [x,y,r,a]=orbAt(o,t);
    x+=Math.sin(t*.5+i*2)*40;y+=Math.cos(t*.4+i)*50;
    const g=cx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(${o.c},${a})`);g.addColorStop(.5,`rgba(${o.c},${a*.35})`);g.addColorStop(1,`rgba(${o.c},0)`);
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
  });
  // grid vertical desenhando
  const gp=oQ(seg(t,.2,1.8));
  cx.globalCompositeOperation='source-over';
  cx.strokeStyle='rgba(147,197,253,0.07)';cx.lineWidth=1;
  for(let i=0;i<=6;i++){const x=96+i*148;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H*gp);cx.stroke()}
  // feixe (respira; mais presente no fim)
  cx.globalCompositeOperation='lighter';
  const ba=.09+.07*Math.sin(t*.8)+.12*seg(t,TL.t4[1],TL.sj[1]+1.5);
  cx.save();cx.translate(W*.5+Math.sin(t*.3)*120,-100);cx.rotate(.22+Math.sin(t*.25)*.05);
  const bg=cx.createLinearGradient(-220,0,220,0);
  bg.addColorStop(0,'rgba(80,140,255,0)');bg.addColorStop(.5,`rgba(147,197,253,${ba})`);bg.addColorStop(1,'rgba(80,140,255,0)');
  cx.fillStyle=bg;cx.fillRect(-220,0,440,H*1.3);cx.restore();
  cx.globalCompositeOperation='source-over';
  // S1: régua que nasce do cursor e vira a máscara branca
  const r1=oQ(seg(t,TL.rule1[0],TL.rule1[1]));
  pline(1040,96,984,1-seg(t,TL.t1[0],TL.t1[0]+.35),r1,seg(t,TL.rule1[0]+.1,TL.rule1[1])*(1-seg(t,TL.t1[0],TL.t1[0]+.4)));
  // S5: a mesma linha, agora base do logotipo
  const L=lineState(t);
  if(t>=TL.ruleIn[0])pline(L.y,L.x0,L.x1,1,L.grow,seg(t,TL.glyph-.2,TL.glyph+.4));
  // poeira
  cx.globalCompositeOperation='source-over';
  dust.forEach(d=>{
    const y=((d.y-t*18*d.z)%H+H)%H,x=d.x+Math.sin(t*d.sp+d.p)*24;
    const a=(.25+.25*Math.sin(t*1.3*d.sp+d.p))*d.z;
    cx.fillStyle=`rgba(191,219,254,${a})`;cx.beginPath();cx.arc(x,y,1.1*d.z+.4,0,6.283);cx.fill();
  });
}

function spec(el,p,a=.5){
  const x=lerp(-60,160,p);
  el.style.background=`linear-gradient(115deg,transparent ${x-14}%,rgba(255,255,255,${.28*a}) ${x-3}%,rgba(191,219,254,${.5*a}) ${x}%,rgba(255,255,255,${.12*a}) ${x+4}%,transparent ${x+16}%)`;
}

/* ---------- linha do tempo mestre ---------- */
const FRAME_DEF=[72,72,936,1776], FRAME_LOGO=[86,1010,908,244];
function render(t){
  drawBg(t);

  /* clip da cena clara (T1 abre a partir da régua; T2 recua para a esquerda) */
  const e1=ioC(seg(t,...TL.t1)), e2=ioC(seg(t,...TL.t2));
  const cTop=1040*(1-e1), cBot=880*(1-e1), cRight=W*e2;
  const light=$('light');
  light.style.visibility=(e1<=0||e2>=1)?'hidden':'visible';
  light.style.clipPath=`inset(${cTop}px ${cRight}px ${cBot}px 0)`;
  const whiteAt=(x,y)=>e1>0&&e2<1&&y>=cTop&&y<=H-cBot&&x<=W-cRight;
  const edge=$('edge2');
  if(e2>0&&e2<1){edge.style.visibility='visible';edge.style.left=(W-cRight)+'px'}else edge.style.visibility='hidden';

  /* S1 — "Nós somos Dusk" */
  {
    $('ty1').style.letterSpacing=lerp(.07,-.02,oQ(seg(t,.3,2.6)))+'em';
    const exitT=TL.t1[0]-.1;
    let last=null;
    allCh.forEach((c,i)=>{
      if(c.dataset.kt===undefined)return;
      const kt=+c.dataset.kt, k=oQ(seg(t,kt,kt+.24)), ko=ioC(seg(t,exitT+i*.025,exitT+.55+i*.025));
      c.style.transform=`translate3d(0,${(1-k)*108-ko*118}%,0)`;
      c.style.opacity=k>0?1:0;
      c.style.filter=(1-k)*7>.05?`blur(${(1-k)*7}px)`:'none';
      const gk=1-seg(t,kt,kt+.4);
      if(c.classList.contains('gr')){c.style.textShadow='none'}else{
        c.style.color=gk>0?`rgb(${lerp(255,147,gk)|0},${lerp(255,197,gk)|0},${lerp(255,253,gk)|0})`:'#fff';
        c.style.textShadow=gk>0?`0 0 ${gk*22}px rgba(147,197,253,${gk*.85})`:'none';}
      if(kt<=t&&ko<.05)last=c;
    });
    $('ty2').querySelectorAll('.gr').forEach((c,i)=>{c.style.backgroundPosition=`${lerp(100,0,seg(t,TL.keys[0],TL.t1[0]))+i*12}% 0`});
    // cursor
    const car=$('caret');
    const ci=seg(t,.15,.3), co=1-ioC(seg(t,...TL.caretOut));
    let lastT=-9;allCh.forEach(c=>{if(c.dataset.kt!==undefined&&+c.dataset.kt<=t)lastT=Math.max(lastT,+c.dataset.kt)});
    const solid=(t-lastT)<.38, blink=((t*2.3)|0)%2===0;
    const vis=ci*co*((solid||blink)?1:0);
    let x,y,hgt;
    const pos=c=>{const line=c.parentNode;return {x:line.offsetLeft+c.offsetLeft+c.offsetWidth+6,big:line.id==='ty2',top:line.offsetTop}};
    if(last){
      const keyed=allCh.filter(c=>c.dataset.kt!==undefined);
      const idx=keyed.indexOf(last), prev=idx>0?keyed[idx-1]:null;
      const P=pos(last), Q=prev?pos(prev):{x:0,big:false,top:last.parentNode.offsetTop};
      const gk=oQ(seg(t,+last.dataset.kt,+last.dataset.kt+.07));
      x=(prev&&Q.big===P.big)?lerp(Q.x,P.x,gk):P.x;
      hgt=62;y=P.top+20;
    }else{x=ch1[0].parentNode.offsetLeft+ch1[0].offsetLeft-4;y=20;hgt=62}
        const sq=lastT>-9?1+(1-oQ(seg(t,lastT,lastT+.12)))*1.4:1;
    car.style.width=(3*sq)+'px';
    car.style.transform=`translate3d(${x}px,${y}px,0) scaleY(${co})`;car.style.height=hgt+'px';car.style.opacity=vis;
  }

  /* S2 — manifesto (cena clara) */
  {
    {
      const hl=headLines[2],u=hl.rl;
      if(!u.firstChild){
        const m0=hl.words[0].parentNode,m1=hl.words[1].parentNode;
        const x0=m0.offsetLeft+8,w=(m1.offsetLeft+m1.offsetWidth)-m0.offsetLeft-16;
        u.style.left=x0+'px';u.style.width=w+'px';
        u.innerHTML=`<svg width="${w}" height="16" viewBox="0 0 ${w} 16"><path pathLength="1" stroke-dasharray="1" d="M2 10 C ${w*.18} 4, ${w*.34} 13, ${w*.52} 8 S ${w*.84} 5, ${w-3} 9"/></svg>`;
      }
      const q=oQ(seg(t,...TL.under)),sl=ioC(seg(t,TL.t2[0],TL.t2[1]));
      u.firstChild.firstChild.style.strokeDashoffset=String(1-q);
      u.style.transform=`translateX(${-sl*(110+2*34)}px)`;
    }
    headLines.forEach((hl,i)=>{
      const t0=TL.lines[i];
      hl.words.forEach((w,j)=>{
        const a=t0+j*.16;
        const k=oB(seg(t,a,a+.7)), kk=clamp(k,0,1.04);
        const sl=ioC(seg(t,TL.t2[0],TL.t2[1]));
        w.style.transform=`translate3d(${-sl*(110+i*34)}px,${(1-kk)*112}%,0)`;
        if(hl.sans[j])w.style.letterSpacing=lerp(.06,-.03,oQ(seg(t,a,a+.9)))+'em';
        else w.style.backgroundPosition=`${lerp(100,0,seg(t,a,a+3.0))+i*7}% 0`;
      });
    });
  }

  /* S3 — frentes */
  {
    const p=ioC(seg(t,...TL.t3));
    const tk=oQ(seg(t,TL.title,TL.title+.9));
    const sc=1+p*.3;
    const tit=$('tit3');
    tit.style.transform=`translate3d(${(540-96-300)*0}px,${-p*80}px,0) scale(${1+p*.2})`;tit.style.opacity=1-p;tit.style.visibility=(tk<=0||p>=1)?'hidden':'visible';
    rise(tit.querySelector('.serif'),tk);
    cardEls.forEach((c,i)=>{
      const s0=TL.cards[i];
      const k=ioC(seg(t,s0,s0+.8));
      const ex=(1-k)*[0,-240,240][i], ey=(1-k)*[170,70,70][i];
      const sck=1+p*.4, ox=(c.cx-540)*(sck-1), oy=(c.cy-960)*(sck-1);
      tf(c.el,{x:ex+ox,y:ey+oy+Math.sin(t*.9+i)*5*k,s:lerp(.94,1,k)*sck,rx:lerp(16,0,k)*(1-p),o:k*(1-p)});
      spec(c.spec,seg(t,s0+.6,s0+2.4),k);
      c.cr.style.transform=`scaleX(${oQ(seg(t,s0+.2,s0+.9))})`;
      rise(c.h3,oQ(seg(t,s0+.35,s0+.95)),0,(1-oQ(seg(t,s0+.35,s0+.95)))*6);
      c.words.forEach((w,j)=>{const a=s0+.6+j*.07;rise(w,oQ(seg(t,a,a+.55)))});
      c.paths.forEach((pp,j)=>{
        const q=oQ(seg(t,s0+.3+j*.1,s0+1.2+j*.1));
        pp.style.strokeDasharray='1';pp.style.strokeDashoffset=String(1-q);
      });
    });
  }

  /* S4 — galeria de aplicações (vidro): fileiras rápidas, pulso na batida */
  {
    const g=$('gallery'),tilt=$('gtilt');
    const inn=ioC(seg(t,TL.rows[0]-.1,TL.rows[4]+.9));
    const o4=ioC(seg(t,...TL.t4));
    g.style.visibility=(t<TL.rows[0]-.15||o4>=1)?'hidden':'visible';
    const pulse=0;
    tilt.style.transform=`rotate(${lerp(-15,-9,inn)*(1-o4)}deg) scale(${lerp(.72,1.1,inn)-o4*.1+pulse})`;
    const mid=Math.floor(rowEls.length/2);
    rowEls.forEach((row,j)=>{
      const cfg=ROWCFG[j],k=oQ(seg(t,TL.rows[j],TL.rows[j]+1.0));
      const dx=cfg.base+cfg.dir*cfg.sp*(t-TL.rows[0])+cfg.dir*(-1)*(1-k)*900;
      let y=0,sy=1,op=k;
      if(j<mid)y=-o4*o4*(1500+(mid-j)*200);
      if(j>mid)y=o4*o4*(1500+(j-mid)*200);
      if(j===mid)sy=lerp(1,.004,o4);
      if(j!==mid)op*=1-seg(o4,.7,1);
      row.style.transform=`translate3d(${dx}px,${y}px,0) scaleY(${sy})`;
      row.style.opacity=op;
    });
  }

  /* S5 — encerramento */
  {
    sjSpans.forEach((s,i)=>rise(s,oQ(seg(t,TL.sj[i],TL.sj[i]+1.0)),0,(1-oQ(seg(t,TL.sj[i],TL.sj[i]+1.0)))*10));
    rise(aoSpan,oQ(seg(t,TL.ao,TL.ao+.7)));
    glyphs.forEach((gl,i)=>{
      const k=oE(seg(t,TL.glyph+i*.09,TL.glyph+i*.09+.85));
      gl.setAttribute('transform',`translate(0 ${(1-k)*1250})`);
    });
    const lk=ioC(seg(t,TL.lock[0],TL.lock[1]));
    const pk=oQ(seg(t,TL.pill,TL.pill+.8));
    tf($('pill'),{y:lerp(36,0,pk),o:pk});
    $('logo').style.visibility=t>=TL.glyph?'visible':'hidden';
    // moldura de precisão: tela cheia → trava ao redor do logotipo
    const fr=[0,1,2,3].map(i=>lerp(FRAME_DEF[i],FRAME_LOGO[i],lk));
    const fa=oQ(seg(t,.3,1.4))*(1-.6*seg(t,TL.rows[0],TL.rows[4]+.5)*(1-seg(t,TL.t4[0],TL.t4[1])))+.0;
    const cs=[['tl',fr[0],fr[1]],['tr',fr[0]+fr[2]-46,fr[1]],['bl',fr[0],fr[1]+fr[3]-46],['br',fr[0]+fr[2]-46,fr[1]+fr[3]-46]];
    cs.forEach(([cls,x,y])=>{
      const el=document.querySelector('#frame .'+cls);
      el.style.left=x+'px';el.style.top=y+'px';
      const cxm=x+(cls[1]==='r'?46:0), cym=y+(cls[0]==='b'?46:0);
      el.style.setProperty('--fc',whiteAt(cxm,cym)?'rgba(6,20,43,.5)':'rgba(147,197,253,.55)');
      el.style.opacity=Math.min(1,fa);
    });
  }
}
window.render=render;window.TOTAL=T;window.TL=TL;
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))])
  .then(()=>{window.READY=true;render(+(new URLSearchParams(location.search).get('t')||0))});
</script>
